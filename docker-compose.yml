services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-portal-documentos}
    ports:
      # host:container — 5433 no host para não colidir com um Postgres local na 5432;
      # só em 127.0.0.1 para não expor a senha de desenvolvimento na rede
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ adia a expansão para o shell do container, que já tem essas variáveis.
      # -h 127.0.0.1 força TCP: o servidor temporário do init só ouve no socket unix,
      # então sem isso o healthcheck pode passar antes do servidor real subir.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    environment:
      # Dentro da rede do Compose o banco é db:5432 (a 5433 é só a porta publicada no host)
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-portal-documentos}
      PORT: 3001
      # Única origem liberada no CORS: o frontend acessado pelo navegador
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Valor padrão só para avaliação local; em qualquer outro ambiente, defina JWT_SECRET
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
      # Compartilhado com o frontend: prova que é ele repassando o IP do cliente ao rate limit
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-only-proxy-secret-change-me-0123456789}
    ports:
      # Só em 127.0.0.1: com o segredo JWT padrão, a API não deve ficar aberta para a rede local
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /health consulta o banco: só fica healthy depois das migrations e com o banco respondendo
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 5s
      timeout: 5s
      # ~130s de tolerância (migrations + seed em máquina lenta) antes de o compose desistir
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      args:
        # URL usada pelo navegador (fora do Docker), embutida no bundle no build
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    environment:
      # URL usada pelos Server Components (dentro da rede do Compose)
      API_URL: http://backend:3001
      # Mesmo valor do backend (repasse do IP do cliente nas leituras feitas pelo servidor)
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-only-proxy-secret-change-me-0123456789}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
